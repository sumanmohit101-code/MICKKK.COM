name: Update NSE Results Data

on:
  schedule:
    - cron: "30 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-results:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Fetch NSE results
        run: |
          python <<'PY'
          import requests
          import json
          import os
          from datetime import datetime, timedelta

          url = "https://www.nseindia.com/api/corporate-financial-results"

          session = requests.Session()

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36",
              "Accept": "application/json,text/plain,*/*",
              "Accept-Language": "en-US,en;q=0.9",
              "Referer": "https://www.nseindia.com/"
          }

          session.headers.update(headers)

          # First open NSE homepage to obtain cookies
          session.get(
              "https://www.nseindia.com/",
              timeout=30
          )

          today = datetime.now()
          from_date = (today - timedelta(days=400)).strftime("%d-%m-%Y")
          to_date = today.strftime("%d-%m-%Y")

          params = {
              "index": "equities",
              "from_date": from_date,
              "to_date": to_date,
              "csv": "false"
          }

          print("Fetching NSE results...")
          print("From:", from_date)
          print("To:", to_date)

          response = session.get(
              url,
              params=params,
              timeout=60
          )

          response.raise_for_status()

          data = response.json()

          if not isinstance(data, list):
              raise Exception("Unexpected NSE response format")

          print("Records received:", len(data))

          os.makedirs("results", exist_ok=True)

          output = {
              "updatedAt": datetime.utcnow().isoformat() + "Z",
              "source": "NSE",
              "records": data
          }

          with open(
              "results/results.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  separators=(",", ":")
              )

          print("Saved results/results.json")
          PY

      - name: Commit results data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add results/results.json

          if git diff --cached --quiet; then
            echo "No result data changes."
          else
            git commit -m "Auto-update NSE results data"
            git push
          fi
