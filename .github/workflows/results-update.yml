name: Update NSE Results Data

on:
  schedule:
    - cron: "30 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-results:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch NSE Results from Google Apps Script
        env:
          APPS_SCRIPT_URL: "https://script.google.com/macros/s/AKfycbx65jssEWWjfjj53X6x8twwZ83kGoEwVOVA6ms_OHS7u9FDRn56U2sYbfW1SvisibwI/exec"
        run: |
          python <<'PY'
          import requests
          import json
          import os
          from datetime import datetime, timezone

          url = os.environ["APPS_SCRIPT_URL"]

          print("======================================")
          print("NSE RESULTS UPDATE")
          print("======================================")
          print("Source: Google Apps Script")
          print("URL:", url)

          headers = {
              "User-Agent": "Mozilla/5.0",
              "Accept": "application/json,text/plain,*/*"
          }

          print("Fetching NSE results...")

          response = requests.get(
              url,
              headers=headers,
              timeout=120
          )

          print("HTTP status:", response.status_code)
          print("Final URL:", response.url)
          print("Content-Type:", response.headers.get("content-type"))

          response.raise_for_status()

          text = response.text.strip()

          print("Response length:", len(text))

          if not text:
              raise Exception("Google Apps Script returned an empty response")

          try:
              data = response.json()
          except Exception as e:
              print("First 500 characters of response:")
              print(text[:500])
              raise Exception(
                  f"Google Apps Script did not return valid JSON: {e}"
              )

          # Accept either:
          # 1. Direct list of NSE records
          # 2. Object containing records
          if isinstance(data, list):
              records = data

          elif isinstance(data, dict):
              if isinstance(data.get("records"), list):
                  records = data["records"]
              elif isinstance(data.get("data"), list):
                  records = data["data"]
              else:
                  records = data

          else:
              raise Exception("Unexpected response format from Apps Script")

          print("Records received:", len(records) if isinstance(records, list) else "object")

          os.makedirs("results", exist_ok=True)

          output = {
              "updatedAt": datetime.now(timezone.utc).isoformat(),
              "source": "NSE via Google Apps Script",
              "records": records
          }

          with open(
              "results/results.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  separators=(",", ":")
              )

          print("Saved: results/results.json")
          print("======================================")
          print("NSE RESULTS UPDATE COMPLETE")
          print("======================================")
          PY

      - name: Commit results data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add results/results.json

          if git diff --cached --quiet; then
            echo "No result data changes."
          else
            git commit -m "Auto-update NSE results data"
            git push
          fi
